automation:
  methods:
    - method: agent
      tool_setup: >-
        Generative AI tools (publicly available models; nothing unreleased) were used
        to find and prove the results, to write both programs of Section 5 of the
        paper and this Lean formalization, and to draft the text of the paper.
  notes: >-
    This is the statement on the use of AI tools in the paper. The certificate
    hints are written by the unverified program Gen.lean and cut into pieces by
    Cut.lean; Lean's kernel checks every certificate, so the hints are not trusted.

fidelity:
  divergences: >-
    Theorem B is formalized only in the weaker form Q ≥ K/128 (C4.theoremB_weak),
    which is not compared; the paper's Q ≥ K/4 is formalized in lean4body v1.0.
    Bodies are indexed by Fin 4, so the paper's bodies 1, 2, 3, 4 are 0, 1, 2, 3,
    and a configuration is a map Fin 4 → ℝ × ℝ. Division is total in Lean
    (x / 0 = 0); the quantities divided by in the definitions (r_ij for i ≠ j, I and
    M) are nonzero at every collision-free configuration of positive masses.
    Convexity (IsConvex, Order1234) is defined by the signs of the four oriented
    areas; the development proves that Order1234 holds exactly when the bodies are
    the vertices of a strictly convex quadrilateral in this cyclic order
    (order1234_iff, isConvex_iff_order), but the compared statements use the
    definitions by signs. Theorem A for another cyclic order is stated by
    relabelling the bodies with a permutation σ (theoremA_cyclic). Similar allows a
    reflection, as in the paper; theoremA_slice gives uniqueness up to
    orientation-preserving similarity in the slice q₁ = (0,0), q₂ = (1,0). The
    compared nondegeneracy statement is on the configuration space; its shape-space
    form (C4.convex_shape_min, Morse index 0) is proved but not compared.

review:
  status: "self-assessed"
  reviewers: []
  notes: >-
    The proofs are checked by Lean's kernel and again by the type checker nanoda
    (scripts/nanoda_check.sh), which also rejects a certificate in which one number
    is changed (scripts/nanoda_control.py). lake comparator, run locally the way the
    Palomar registry's verification runs it (16 hardware threads, nanoda and con-ron
    as external kernels), accepts the Solution; README.md gives the times and
    memory. The computation of Proposition 5.1 of the paper, which proves the
    stronger bound tr S < 3/4, was repeated with a second, independently written
    program (Section 5.6 of the paper), which is not part of the Lean proof.

alignment:
  namespace: "C4"
  statements:
    - source: "Theorem A, uniqueness up to orientation-preserving similarity, in the slice q₁ = (0,0), q₂ = (1,0)"
      lean: "C4.theoremA_slice"
      module: "C4.TheoremA"
      status: proved
      note: "Exactly one CC whose oriented areas have the signs (+, -, +, -), for every vector of positive masses."
    - source: "Theorem A, existence and uniqueness for the cyclic order (1234)"
      lean: "C4.theoremA"
      module: "C4.TheoremA"
      status: proved
    - source: "Theorem A, existence and uniqueness for every cyclic order"
      lean: "C4.theoremA_cyclic"
      module: "C4.TheoremA"
      status: proved
      note: "The cyclic order is that of the bodies relabelled by a permutation σ."
    - source: "Theorem A, the convex CC is a nondegenerate local minimum of U I^(1/2), on the configuration space"
      lean: "C4.nondegenerate"
      module: "C4.Nondegenerate"
      status: proved
      note: "The Hessian of U I^(1/2) is positive semidefinite with radical the tangent space of the orbit of the similarities, and the minimum is strict off that orbit."
    - source: "Corollary C(iii), first sentence: three convex CCs up to similarity"
      lean: "C4.convex_count"
      module: "C4.CorollaryC"
      status: proved
    - source: "Theorem B, in the weaker form Q ≥ K/128 (the paper proves Q ≥ K/4)"
      lean: "C4.theoremB_weak"
      module: "C4.TheoremB"
      status: "proved in a weaker form; not compared"
      note: "Every use of Theorem B in this development needs only Q ≥ cK for some c > 0. C4.theoremB, with the constant 1/4, is in lean4body v1.0."

acknowledgements: >-
  The formalization uses Lean 4 and Mathlib. The independent checks use the type
  checkers nanoda and con-ron.
