# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Uniqueness of four-body convex central configurations for all masses"
  description: >-
    A Lean 4 and Mathlib formalization of Theorem A of arXiv:2609.35632 on the
    central configurations of the planar Newtonian four-body problem. For every
    choice of four positive masses and every cyclic order of the bodies there is
    exactly one strictly convex central configuration with that cyclic order, up to
    similarity, so there are exactly three convex central configurations up to
    similarity. This answers Problem 10 in the list of Albouy, Cabral and Santos
    (2012). The main step of the paper is Theorem B: at every strictly convex
    central configuration of positive masses, the Hessian form Q of U + (λ/2)I is
    at least one quarter of its radial part K. This formalization proves the weaker
    bound Q ≥ K/128 (C4.theoremB_weak), which is all that the proof of Theorem A
    uses; Theorem B with the constant 1/4 is formalized in lean4body, release v1.0,
    which the paper cites. It follows that every convex central configuration is a
    nondegenerate local minimum of U I^(1/2), whose Hessian vanishes exactly on the
    tangent space of the orbit of the similarities. The computer-assisted step, a
    branch and bound with interval arithmetic over the three-dimensional set of
    normalized convex central configurations in the coordinates of Corbera, Cors
    and Roberts, proves tr S < 127/128 and is checked by Lean's kernel with
    `decide +kernel` in 3875 certificate theorems. No compiled code is trusted, and
    the proofs use only Lean's three standard axioms.
  authors:
    - "Tejasvi Singh Tomar"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Tejasvi Singh Tomar"

classification:
  arxiv: [math.DS, math-ph]
  msc2020: [70F10, 70F15, 58K05, 65G40]

sources:
  - title: "Uniqueness of four-body convex central configurations for all masses"
    authors:
      - "Tejasvi Singh Tomar"
    id: "arXiv:2609.35632"
    type: paper
    location: "https://arxiv.org/abs/2609.35632"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The paper and this formalization have the same author. Section 6.2 of the
      paper describes the formalization in lean4body (release v1.0, commit
