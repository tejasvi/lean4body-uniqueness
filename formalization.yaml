      development with a weaker computer-assisted bound, tr S < 127/128 in place of
      tr S < 3/4, so it proves Q ≥ K/128 in place of Theorem B's Q ≥ K/4.
  - title: "Some problems on the classical n-body problem"
    authors:
      - "Alain Albouy"
      - "Hildeberto E. Cabral"
      - "Alan A. Santos"
    id: "doi:10.1007/s10569-012-9431-1"
    type: paper
    location: "Celest. Mech. Dyn. Astron. 113 (2012), 369–375"
    relationship: background
    note: >-
      Problem 10 asks whether, for the Newtonian potential, the convex central
      configuration of four bodies with a given cyclic order is unique up to
      similarity. Theorem A answers it.
  - title: "Symmetry of planar four-body convex central configurations"
    authors:
      - "Alain Albouy"
      - "Yanning Fu"
      - "Shanzhong Sun"
    id: "doi:10.1098/rspa.2007.0320"
    type: paper
    location: "Proc. R. Soc. A 464 (2008), 1355–1365"
    relationship: background
    note: >-
      Conjectures that the convex central configuration with a given cyclic order
      is unique for all positive masses. The equal-mass base case of the covering
      argument (the module C4.Albouy: a convex central configuration of four equal masses
      is a square) follows the proof of their Theorem 1.
  - title: "Classifying four-body convex central configurations"
    authors:
      - "Montserrat Corbera"
      - "Josep M. Cors"
      - "Gareth E. Roberts"
    id: "doi:10.1007/s10569-019-9911-7"
    type: paper
    location: "Celest. Mech. Dyn. Astron. 131 (2019), Paper No. 34"
    relationship: background
    note: >-
      The coordinates and the normal form of convex central configurations in which
      the set of normalized convex central configurations is described and the
      computation is done (Section 4 of the paper, the module C4.NormalSet).
  - title: "The Hessian of planar central configurations in pair space: decomposition, Morse index and symmetry reduction"
    authors:
      - "Manuele Santoprete"
    id: "arXiv:2609.01857"
    type: paper
    location: "https://arxiv.org/abs/2609.01857"
    relationship: background
    note: >-
      Decomposes the constrained Hessian at a planar central configuration in pair
      space into a positive semidefinite part and a signed part of rank two,
      characterizes definiteness by an explicit 2×2 eigenvalue problem, and calls
      the expected positive answer to Problem 10 the Simó–Yoccoz conjecture. The
      identity Q = K − |σ||L|² (Proposition 3.1 of the paper, `hessQ_identity_abs`)
      is the analogue in the coordinates of the bodies (Remark 3.3(i) of the paper).

related_formalizations:
  - id: "https://github.com/tejasvi/lean4body/tree/58ac0fbf4d664fb80abaedf66d0c68c2cf6644cc"
    relationship: adapts
    note: >-
      lean4body, release v1.0, cited by the paper: Theorems A and B, with the
      constant 1/4 of Theorem B, certified by 3418 theorems that prove tr S < 3/4.
      This repository adapts it: the threshold of the certificates is 127/128, the
      grids are coarser, a cell may be certified piecewise, and every file uses the
      module system. The proofs outside the certificates are the same, with
      C4.theoremB_weak in place of C4.theoremB.

status:
  scope: >-
    Formalized: Theorem A of the paper; Theorem B in the weaker form Q ≥ K/128
    (C4.theoremB_weak); the nondegeneracy of the convex central configurations on
    the configuration space, in the slice q₁ = (0,0), q₂ = (1,0), and on the shape
    space, which Lean builds as a compact real-analytic manifold; Corollary
    C(i)–(iii) except the last sentence of C(iii); Corollary D; and the
    preliminaries (Lemmas 2.1–2.6, Proposition 2.7, Proposition 3.1, Corollary 3.2,
    Lemmas 4.1 and 4.2). The Comparator configuration compares five of these
    statements: C4.theoremA_slice, C4.theoremA, C4.theoremA_cyclic,
    C4.nondegenerate and C4.convex_count; README.md lists the others. Not
    formalized here: the constant 1/4 of Theorem B (the certificates prove
    tr S < 127/128, which gives Q ≥ K/128; lean4body v1.0 certifies tr S < 3/4,
    which gives Q ≥ K/4); Corollary C(iv) and the last sentence of Corollary
    C(iii), which use results of Moeckel on collinear central configurations and on
    the topology of the shape space; the identification of the shape space with
    CP², which nothing uses; the rank and the image of ṙ in Lemma 2.4; Remarks
    3.3(ii) and 4.3; Proposition 7.2 (the limits at the corner); and the bound
    Q ≥ 13K/32 of Section 5.6, which comes from the second, unformalized program.
